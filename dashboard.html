<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Premium Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #0f172a;
        }
    </style>
</head>

<body style="flex-direction: column;">
    <div class="login-container dashboard-container">
        <div class="login-header">
            <h1>Welcome!</h1>
            <p>You have successfully authenticated securely.</p>
        </div>
        <div class="profile-card">
            <h3 class="card-title">Profile Information</h3>
            <ul class="profile-list">
                <li><strong>Email:</strong> user@example.com</li>
                <li><strong>City:</strong> Your City</li>
                <li><strong>Status:</strong> Active</li>
            </ul>
        </div>
        <div style="margin-top: 40px; text-align: center;">
            <a href="index.html" class="btn-login"
                style="display: inline-block; text-decoration: none; padding: 12px 40px;">Log Out</a>
        </div>
    </div>
</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Premium Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'home/css/style.css' %}">
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <h1>Join Us</h1>
            <p>Create your premium account today</p>
        </div>

        {% if error %}
        <div
            style="color: #ff4d4d; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid rgba(255, 77, 77, 0.3);">
            {{ error }}
        </div>
        {% endif %}

        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="e.g. John Doe" required>
                    <div class="input-focus-line"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    <div class="input-focus-line"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <div class="input-wrapper">
                    <input type="text" id="city" name="city" placeholder="Your City" required>
                    <div class="input-focus-line"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="At least 7 characters" required
                        minlength="7">
                    <div class="input-focus-line"></div>
                </div>
            </div>

            <button type="submit" class="btn-login">Create Account</button>
        </form>

        <div class="footer-links">
            <span>Already have an account?</span>
            <a href="{% url 'login' %}">Sign In</a>
        </div>
    </div>

    <script src="{% static 'home/js/script.js' %}"></script>
</body>

</html>

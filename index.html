<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #0f172a;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>پذا وش آتکغئے</h1>
            <p>وثی اکاؤنٹ ئا سائن ان کن</p>
        </div>
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html'">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <div class="input-focus-line"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <div class="input-focus-line"></div>
                </div>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <div class="footer-links" style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <a href="signup.html">Don't have an account? Create one</a>
            <a href="#">Forgot Password?</a>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
